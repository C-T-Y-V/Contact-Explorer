name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in Contact Explorer
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide detailed device and reproduction steps.
        *Note: If you are reporting a security flaw, please use [Private Security Advisories](https://github.com/C-T-Y-V/Contact-Explorer/security/advisories/new).*

  - type: input
    id: app_version
    attributes:
      label: Contact Explorer Version
      description: What version of the application are you running? (e.g. v6.3.0, VersionCode 9)
      placeholder: "v6.3.0"
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: Device Model & Android OS Version
      description: Specify your device manufacturer, model, and Android OS API level (e.g. Pixel 8 / Android 14 / API 34).
      placeholder: "Samsung Galaxy S23 / Android 14 (OneUI 6.0)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When importing a vCard with over 1,000 contacts, the progress dialog..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      value: |
        1. Open Contact Explorer
        2. Navigate to '...'
        3. Tap on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logcat / Stack Trace (Sanitized)
      description: Paste relevant crash logs or stack traces here. (Ensure all personal phone numbers and names are redacted).
      render: shell

  - type: checkboxes
    id: checklists
    attributes:
      label: Verification Checklist
      options:
        - label: I confirmed that no personal data (PII) or phone numbers are exposed in this report.
          required: true
        - label: I verified this issue is reproducible on the latest release.
          required: true
