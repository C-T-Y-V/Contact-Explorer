# ==============================================================================
# Contact Explorer — Enterprise Release & Tag Publishing Pipeline
# A CTYV Product | Priyanshu Sharma (CTYV)
# ==============================================================================

name: Release & Asset Publishing

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Compile Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Validate Release APK Performance Budget
        env:
          MAX_APK_SIZE_BYTES: 5242880
          STRICT_BUDGET: "false"
        run: |
          chmod +x scripts/verify-apk-size.sh
          ./scripts/verify-apk-size.sh

      - name: Package Release Binaries & Compute SHA-256
        id: package_assets
        run: |
          VERSION="${GITHUB_REF_NAME}"
          APK_SRC=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          APK_DEST="ContactExplorer_${VERSION}_CTYV.apk"
          cp "$APK_SRC" "$APK_DEST"

          sha256sum "$APK_DEST" > SHA256SUMS.txt
          SHA_VAL=$(awk '{print $1}' SHA256SUMS.txt)
          SIZE_BYTES=$(stat -c%s "$APK_DEST")
          SIZE_MB=$(awk -v s="$SIZE_BYTES" 'BEGIN { printf "%.2f", s / 1048576 }')

          echo "apk_name=$APK_DEST" >> $GITHUB_OUTPUT
          echo "apk_sha=$SHA_VAL" >> $GITHUB_OUTPUT
          echo "apk_size_mb=$SIZE_MB" >> $GITHUB_OUTPUT

      - name: Generate Changelog & Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          # Contact Explorer Enterprise Android Release

          **Brand Identity:** A CTYV Product  
          **Lead Architect:** Priyanshu Sharma (CTYV)  
          **Legal Attribution:** Copyright © 2026 Priyanshu Sharma (CTYV) — A CTYV Product. All rights reserved.  

          ### Security & Integrity Manifest
          - **Release Binary:** `${{ steps.package_assets.outputs.apk_name }}`
          - **Measured Size:** `${{ steps.package_assets.outputs.apk_size_mb }} MB`
          - **Target Performance Budget:** `5.0 MB (Advisory Benchmark)`
          - **SHA-256 Checksum:** `${{ steps.package_assets.outputs.apk_sha }}`
          - **Network Permissions:** `0 (Zero-Trust Offline Architecture)`

          ### Core Architecture Highlights
          - **Big Tech Modularization:** Segregated into 12 DAG modules across Presentation, Domain, and Data.
          - **Unidirectional MVI State:** Atomic `ExplorerUiState` with 0ms optimistic UI rendering.
          - **Offline Vault Engine:** High-performance vCard 3.0/4.0 dual-mode backup & restore.
          - **Enterprise Theme Engine:** 5 dynamic Material 3 color presets with vector splash animation.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.package_assets.outputs.apk_name }}
            SHA256SUMS.txt
          draft: false
          prerelease: false
