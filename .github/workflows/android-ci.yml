name: Android CI & Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Size (< 5.0 MB Limit)
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
            echo "Release APK Size: ${SIZE_MB} MB ($SIZE_BYTES bytes)"
            # Strict budget: Must be under 5.0 MB (5,242,880 bytes)
            if [ "$SIZE_BYTES" -gt 5242880 ]; then
              echo "❌ ERROR: Release APK exceeds the 5.0 MB strict performance budget!"
              exit 1
            fi
            echo "✅ Release APK size is within budget (${SIZE_MB} MB <= 5.0 MB)"
          else
            echo "❌ ERROR: Release APK was not found at expected path"
            exit 1
          fi

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: contact-explorer-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
