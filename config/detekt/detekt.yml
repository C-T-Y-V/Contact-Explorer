# ==============================================================================
# Contact Explorer — Detekt Static Analysis Specification
# A CTYV Product | Priyanshu Sharma (CTYV)
# ==============================================================================

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  ComplexCondition:
    threshold: 4
  ComplexInterface:
    threshold: 10
  CyclomaticComplexMethod:
    threshold: 15
  LargeClass:
    threshold: 600
  LongMethod:
    threshold: 80
  LongParameterList:
    threshold: 7
    ignoreDefaultParameters: true
  NestedBlockDepth:
    threshold: 4
  TooManyFunctions:
    threshold: 25

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    allowedExceptionNameRegex: "^(ignore|expected)$"
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

formatting:
  active: true
  android: true
  autoCorrect: true
  Indentation:
    indentSize: 4
  MaximumLineLength:
    maxLineLength: 140
  NoTrailingSpaces:
    active: true

naming:
  active: true
  ClassNaming:
    classPattern: "[A-Z][a-zA-Z0-9]*"
  FunctionNaming:
    functionPattern: "([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)" # Allow Composable PascalCase functions
  PackageNaming:
    packagePattern: "^[a-z]+(\\.[a-z][A-Za-z0-9]*)*$"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Z0-9_]*"

performance:
  active: true
  SpreadOperator:
    active: false # Used pragmatically in ContactsContract selection queries
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  DuplicateCaseInWhenExpression:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  InvalidRange:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

style:
  active: true
  ForbiddenComment:
    values:
      - "FIXME:"
      - "STOPSHIP:"
  MagicNumber:
    active: false # Allow UI dimensions, color hexes, and durations
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: false
